version: 2.1

orbs:
  lucos: lucos/deploy@0

jobs:
  # Runs the tests/ smoke tests that don't depend on this machine's live
  # production state (host SSH access, etc.). tests/verify-teammate-quote
  # uses a synthetic fixture (tests/fixtures/verify-teammate-quote/) rather
  # than real session history, so it's portable to a fresh checkout — see
  # lucas42/lucos_agent#76.
  test:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install requests
      - run:
          name: Run tests/arachne-mcp-proxy
          command: tests/arachne-mcp-proxy
      - run:
          name: Run tests/verify-teammate-quote
          command: tests/verify-teammate-quote

  # Temporary, zero-side-effect diagnostic for lucas42/lucos_agent#72 — prints
  # the actual value of << pipeline.trigger.type >> for whatever triggered
  # this pipeline, so the "schedule" vs "scheduled_pipeline" fix above can be
  # confirmed against a real scheduled firing rather than assumed from docs.
  # Remove once confirmed against a real 03:00 UTC run.
  debug-trigger-type:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Print pipeline.trigger.type
          command: echo "trigger.type=<< pipeline.trigger.type >>"

workflows:
  # Runs the tests/ suite on every push, on all branches — not gated to main,
  # so a PR shows the result before merge.
  test:
    jobs:
      - test

  # No `when` gate — runs on every pipeline regardless of trigger type, so it
  # can observe the literal value for webhook/api pushes immediately and for
  # a real schedule trigger at the next 03:00 UTC. See debug-trigger-type job.
  debug-trigger-type:
    jobs:
      - debug-trigger-type

  # Runs daily at 03:00 UTC — well outside the 07:10 UTC Dependabot merge
  # window — to safely prune old tagged images that accumulate over time.
  # The -a flag is only safe outside concurrent deploys (see lucos_deploy_orb#54).
  #
  # The trigger-type literal below is "schedule", not "scheduled_pipeline" —
  # that was the actual bug (lucas42/lucos_agent#72): CircleCI's REST API
  # reports a scheduled pipeline's trigger.type as "scheduled_pipeline", but
  # the config-compile-time << pipeline.trigger.type >> value uses "schedule"
  # for the same thing. Comparing against the REST-API string here made this
  # `when` silently evaluate false on every single scheduled firing since the
  # workflow was added — no error, just an empty compiled workflow. Verified
  # against a live scheduled run's actual << pipeline.trigger.type >> value
  # via debug-trigger-type below before shipping this fix, rather than
  # trusting documentation alone.
  prune-images:
    when:
      equal: [ schedule, << pipeline.trigger.type >> ]
    jobs:
      - lucos/prune-images:
          host-domain: avalon.s.l42.eu
          ssh-user: lucos-agent
          ssh-key-fingerprint: "f3:64:6b:31:47:5c:fd:1b:fd:c6:0a:54:bf:09:6d:d1"
      - lucos/prune-images:
          host-domain: xwing-v4.s.l42.eu
          ssh-user: lucos-agent
          ssh-key-fingerprint: "f3:64:6b:31:47:5c:fd:1b:fd:c6:0a:54:bf:09:6d:d1"
      - lucos/prune-images:
          host-domain: salvare-v4.s.l42.eu
          ssh-port: 2202
          ssh-user: lucos-agent
          ssh-key-fingerprint: "f3:64:6b:31:47:5c:fd:1b:fd:c6:0a:54:bf:09:6d:d1"
