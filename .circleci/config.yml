version: 2.1

orbs:
  lucos: lucos/deploy@0

jobs:
  # Runs the tests/ smoke tests that don't depend on this machine's live
  # production state (host SSH access, etc.). tests/verify-teammate-quote
  # uses a synthetic fixture (tests/fixtures/verify-teammate-quote/) rather
  # than real session history, so it's portable to a fresh checkout — see
  # lucas42/lucos_agent#76.
  test:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install requests
      - run:
          name: Run tests/arachne-mcp-proxy
          command: tests/arachne-mcp-proxy
      - run:
          name: Run tests/verify-teammate-quote
          command: tests/verify-teammate-quote

workflows:
  # Runs the tests/ suite on every push, on all branches — not gated to main,
  # so a PR shows the result before merge.
  test:
    jobs:
      - test

  # Runs daily at 03:00 UTC — well outside the 07:10 UTC Dependabot merge
  # window — to safely prune old tagged images that accumulate over time.
  # The -a flag is only safe outside concurrent deploys (see lucos_deploy_orb#54).
  # Trigger-type literal is "schedule", not "scheduled_pipeline" (#72).
  prune-images:
    when:
      equal: [ schedule, << pipeline.trigger.type >> ]
    jobs:
      - lucos/prune-images:
          host-domain: avalon.s.l42.eu
          ssh-user: lucos-agent
          ssh-key-fingerprint: "f3:64:6b:31:47:5c:fd:1b:fd:c6:0a:54:bf:09:6d:d1"
      - lucos/prune-images:
          host-domain: xwing-v4.s.l42.eu
          ssh-user: lucos-agent
          ssh-key-fingerprint: "f3:64:6b:31:47:5c:fd:1b:fd:c6:0a:54:bf:09:6d:d1"
      - lucos/prune-images:
          host-domain: salvare-v4.s.l42.eu
          ssh-port: 2202
          ssh-user: lucos-agent
          ssh-key-fingerprint: "f3:64:6b:31:47:5c:fd:1b:fd:c6:0a:54:bf:09:6d:d1"
